<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PONG</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: "Courier New", monospace;
    overflow: hidden;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
  }
  canvas {
    background: #000;
    border: 2px solid #fff;
    image-rendering: pixelated;
    max-width: 95vw;
    max-height: 80vh;
    touch-action: none;
  }
  #hint {
    margin-top: 12px;
    font-size: 14px;
    letter-spacing: 2px;
    color: #888;
    text-align: center;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="800" height="500"></canvas>
  <div id="hint">W / S &nbsp;or&nbsp; MOUSE to move &nbsp;&middot;&nbsp; SPACE to serve &nbsp;&middot;&nbsp; first to 11 wins</div>
</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;

  // --- Game constants ---
  const PADDLE_W = 12;
  const PADDLE_H = 80;
  const PADDLE_MARGIN = 24;
  const PADDLE_SPEED = 6;
  const BALL_SIZE = 12;
  const BALL_SPEED_START = 5;
  const BALL_SPEED_MAX = 13;
  const WIN_SCORE = 11;
  const AI_SPEED = 5;        // max AI paddle speed (intentionally beatable)
  const AI_REACTION = 0.12;  // easing factor toward target

  // --- State ---
  const player = { x: PADDLE_MARGIN, y: H / 2 - PADDLE_H / 2, score: 0 };
  const cpu = { x: W - PADDLE_MARGIN - PADDLE_W, y: H / 2 - PADDLE_H / 2, score: 0 };
  const ball = { x: W / 2, y: H / 2, vx: 0, vy: 0, speed: BALL_SPEED_START };

  let upPressed = false;
  let downPressed = false;
  let mouseY = null;
  let waitingForServe = true;
  let serveDir = Math.random() < 0.5 ? -1 : 1;
  let gameOver = false;
  let winner = "";

  // --- Sound (Web Audio blips, like the original) ---
  let audioCtx = null;
  function beep(freq, duration) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "square";
      osc.frequency.value = freq;
      gain.gain.value = 0.05;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch (e) { /* audio not available */ }
  }
  const blipPaddle = () => beep(440, 0.05);
  const blipWall = () => beep(220, 0.05);
  const blipScore = () => beep(160, 0.18);

  // --- Input ---
  document.addEventListener("keydown", (e) => {
    if (e.key === "w" || e.key === "W" || e.key === "ArrowUp") upPressed = true;
    if (e.key === "s" || e.key === "S" || e.key === "ArrowDown") downPressed = true;
    if (e.code === "Space") {
      e.preventDefault();
      if (gameOver) resetGame();
      else waitingForServe = false;
    }
  });
  document.addEventListener("keyup", (e) => {
    if (e.key === "w" || e.key === "W" || e.key === "ArrowUp") upPressed = false;
    if (e.key === "s" || e.key === "S" || e.key === "ArrowDown") downPressed = false;
  });
  canvas.addEventListener("mousemove", (e) => {
    const rect = canvas.getBoundingClientRect();
    mouseY = (e.clientY - rect.top) * (H / rect.height);
  });
  canvas.addEventListener("mouseleave", () => { mouseY = null; });
  canvas.addEventListener("click", () => {
    if (gameOver) resetGame();
    else waitingForServe = false;
  });
  // Touch support
  canvas.addEventListener("touchmove", (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    mouseY = (e.touches[0].clientY - rect.top) * (H / rect.height);
  }, { passive: false });
  canvas.addEventListener("touchstart", (e) => {
    e.preventDefault();
    if (gameOver) resetGame();
    else waitingForServe = false;
  }, { passive: false });

  // --- Serve / reset ---
  function serve() {
    ball.x = W / 2;
    ball.y = H / 2;
    ball.speed = BALL_SPEED_START;
    // serve toward the player who was just scored on
    const angle = (Math.random() * 0.5 - 0.25) * Math.PI; // -45..45 deg
    ball.vx = serveDir * ball.speed * Math.cos(angle);
    ball.vy = ball.speed * Math.sin(angle);
    waitingForServe = true;
  }

  function resetGame() {
    player.score = 0;
    cpu.score = 0;
    player.y = H / 2 - PADDLE_H / 2;
    cpu.y = H / 2 - PADDLE_H / 2;
    gameOver = false;
    winner = "";
    serveDir = Math.random() < 0.5 ? -1 : 1;
    serve();
  }

  function point(scorer) {
    blipScore();
    if (scorer === "player") {
      player.score++;
      serveDir = 1; // serve toward cpu next
    } else {
      cpu.score++;
      serveDir = -1; // serve toward player next
    }
    if (player.score >= WIN_SCORE) { gameOver = true; winner = "PLAYER WINS"; }
    else if (cpu.score >= WIN_SCORE) { gameOver = true; winner = "CPU WINS"; }
    if (!gameOver) serve();
  }

  // --- Update ---
  function update() {
    if (gameOver) return;

    // Player paddle: mouse takes priority if present, else keyboard
    if (mouseY !== null) {
      player.y = mouseY - PADDLE_H / 2;
    } else {
      if (upPressed) player.y -= PADDLE_SPEED;
      if (downPressed) player.y += PADDLE_SPEED;
    }
    player.y = Math.max(0, Math.min(H - PADDLE_H, player.y));

    // CPU paddle: eased tracking, only chases when ball approaches
    let target = cpu.y + PADDLE_H / 2;
    if (ball.vx > 0) {
      target = ball.y;
    } else {
      target = H / 2; // drift to center when ball moves away
    }
    const diff = (target - (cpu.y + PADDLE_H / 2)) * AI_REACTION;
    cpu.y += Math.max(-AI_SPEED, Math.min(AI_SPEED, diff));
    cpu.y = Math.max(0, Math.min(H - PADDLE_H, cpu.y));

    if (waitingForServe) return;

    // Move ball
    ball.x += ball.vx;
    ball.y += ball.vy;

    // Top / bottom walls
    if (ball.y <= 0) { ball.y = 0; ball.vy = -ball.vy; blipWall(); }
    if (ball.y + BALL_SIZE >= H) { ball.y = H - BALL_SIZE; ball.vy = -ball.vy; blipWall(); }

    // Player paddle collision
    if (ball.vx < 0 &&
        ball.x <= player.x + PADDLE_W &&
        ball.x >= player.x &&
        ball.y + BALL_SIZE >= player.y &&
        ball.y <= player.y + PADDLE_H) {
      bounce(player);
    }

    // CPU paddle collision
    if (ball.vx > 0 &&
        ball.x + BALL_SIZE >= cpu.x &&
        ball.x + BALL_SIZE <= cpu.x + PADDLE_W &&
        ball.y + BALL_SIZE >= cpu.y &&
        ball.y <= cpu.y + PADDLE_H) {
      bounce(cpu);
    }

    // Scoring
    if (ball.x + BALL_SIZE < 0) point("cpu");
    else if (ball.x > W) point("player");
  }

  // Reflect ball off a paddle; angle depends on where it hits
  function bounce(paddle) {
    blipPaddle();
    const relative = (ball.y + BALL_SIZE / 2 - (paddle.y + PADDLE_H / 2)) / (PADDLE_H / 2);
    const clamped = Math.max(-1, Math.min(1, relative));
    const maxAngle = Math.PI * 0.42; // ~75 deg
    const angle = clamped * maxAngle;

    ball.speed = Math.min(BALL_SPEED_MAX, ball.speed + 0.4);
    const dir = paddle === player ? 1 : -1;
    ball.vx = dir * ball.speed * Math.cos(angle);
    ball.vy = ball.speed * Math.sin(angle);

    // nudge ball outside the paddle to avoid sticking
    if (paddle === player) ball.x = player.x + PADDLE_W;
    else ball.x = cpu.x - BALL_SIZE;
  }

  // --- Render ---
  function drawNet() {
    ctx.fillStyle = "#fff";
    const dash = 14, gap = 12;
    for (let y = 0; y < H; y += dash + gap) {
      ctx.fillRect(W / 2 - 2, y, 4, dash);
    }
  }

  // Blocky 7-segment-ish digits, scaled pixel style
  function drawDigit(n, x, y, scale) {
    const segs = {
      0: [1,1,1,0,1,1,1], 1: [0,0,1,0,0,1,0], 2: [1,0,1,1,1,0,1],
      3: [1,0,1,1,0,1,1], 4: [0,1,1,1,0,1,0], 5: [1,1,0,1,0,1,1],
      6: [1,1,0,1,1,1,1], 7: [1,0,1,0,0,1,0], 8: [1,1,1,1,1,1,1],
      9: [1,1,1,1,0,1,1]
    };
    const s = segs[n];
    const t = scale;            // thickness
    const w = t * 4;            // digit width
    const h = t * 7;            // digit height
    ctx.fillStyle = "#fff";
    // segments: 0 top,1 top-left,2 top-right,3 middle,4 bot-left,5 bot-right,6 bottom
    if (s[0]) ctx.fillRect(x, y, w, t);
    if (s[1]) ctx.fillRect(x, y, t, h / 2);
    if (s[2]) ctx.fillRect(x + w - t, y, t, h / 2);
    if (s[3]) ctx.fillRect(x, y + h / 2 - t / 2, w, t);
    if (s[4]) ctx.fillRect(x, y + h / 2, t, h / 2);
    if (s[5]) ctx.fillRect(x + w - t, y + h / 2, t, h / 2);
    if (s[6]) ctx.fillRect(x, y + h - t, w, t);
  }

  function drawScore(num, centerX, y) {
    const scale = 10;
    const digits = String(num).split("").map(Number);
    const digitW = scale * 4;
    const spacing = scale * 2;
    const totalW = digits.length * digitW + (digits.length - 1) * spacing;
    let dx = centerX - totalW / 2;
    for (const d of digits) {
      drawDigit(d, dx, y, scale);
      dx += digitW + spacing;
    }
  }

  function render() {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);

    drawNet();

    // Scores
    drawScore(player.score, W / 2 - 100, 30);
    drawScore(cpu.score, W / 2 + 100, 30);

    // Paddles
    ctx.fillStyle = "#fff";
    ctx.fillRect(player.x, player.y, PADDLE_W, PADDLE_H);
    ctx.fillRect(cpu.x, cpu.y, PADDLE_W, PADDLE_H);

    // Ball
    ctx.fillRect(ball.x, ball.y, BALL_SIZE, BALL_SIZE);

    // Messages
    ctx.textAlign = "center";
    if (gameOver) {
      ctx.font = "48px 'Courier New', monospace";
      ctx.fillText(winner, W / 2, H / 2 + 100);
      ctx.font = "20px 'Courier New', monospace";
      ctx.fillText("press SPACE to play again", W / 2, H / 2 + 140);
    } else if (waitingForServe) {
      ctx.font = "20px 'Courier New', monospace";
      ctx.fillText("press SPACE to serve", W / 2, H / 2 + 120);
    }
  }

  // --- Main loop ---
  function loop() {
    update();
    render();
    requestAnimationFrame(loop);
  }

  serve();
  loop();
})();
</script>
</body>
</html>
